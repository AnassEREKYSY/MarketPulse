# Site for the VM's reverse-proxy container (/opt/nginx/conf.d/marketpulse.conf).
# The name is resolved at request time through Docker's DNS, so redeploys (new container IP)
# never cause 502s and the proxy still starts when MarketPulse is down.

server {
    listen 80;
    server_name marketpulse.anasserekysy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name marketpulse.anasserekysy.com;

    # Own certificate, issued with the webroot method (see DEPLOYMENT.md).
    ssl_certificate /etc/letsencrypt/live/marketpulse.anasserekysy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketpulse.anasserekysy.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $marketpulse http://marketpulse:8080;

    location / {
        proxy_pass $marketpulse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
