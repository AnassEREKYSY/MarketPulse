# Step 1 only: lets certbot issue the certificate before the HTTPS site exists. Replaced by marketpulse.conf.

server {
    listen 80;
    server_name marketpulse.anasserekysy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
