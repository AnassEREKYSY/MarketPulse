name: CI/CD - Test, build, push to GHCR and deploy to OVH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: marketpulse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - build and tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore MarketPulse.sln
      - run: dotnet build MarketPulse.sln -c Release --no-restore
      - run: dotnet test MarketPulse.sln -c Release --no-build --logger "console;verbosity=normal"

  client:
    name: Client - build and end-to-end tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: client/playwright-report, retention-days: 7 }

  image:
    name: Docker image
    needs: [api, client]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}' }
      # On pull requests the image is only built (proves the Dockerfile works), not pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/anasserekysy/marketpulse:latest
            ghcr.io/anasserekysy/marketpulse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OVH
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deployment files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/deploy.sh
          target: marketpulse
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          MARKETPULSE_BIND: ${{ vars.MARKETPULSE_BIND }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,ADZUNA_APP_ID,ADZUNA_APP_KEY,MARKETPULSE_BIND
          command_timeout: 15m
          script: |
            chmod +x ~/marketpulse/deploy.sh
            ~/marketpulse/deploy.sh
